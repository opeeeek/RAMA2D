<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BelkaDR</title>
<style id="appcss">:root {
  --bg: #eef0f3; --panel: #ffffff; --panel2: #f7f8fa; --line: #d9dde3; --line2: #e8ebef;
  --ink: #1b2230; --ink2: #4a5466; --ink3: #7a8494;
  --acc: #1d5bb8; --acc2: #e8f0fc; --acc3: #0f3f86; --onacc: #ffffff; --focus: #8fb2ea;
  --ok: #1d7f3c; --okbg: #e6f4ea; --warn: #a35d00; --warnbg: #fdf1dc; --fail: #c0262d; --failbg: #fde8e8; --info: #5b6576; --infobg: #eef0f3;
  --errln: #f3c2c4; --wrnln: #f0d6a8; --ubbg: #edf0f3; --ubwarn: #d89a2b;
  --field: #ffffff; --hover: #e3e7ed; --grp: #f2f5f9; --itembg: #fbfcfe; --addln: #a9c3ec; --addhov: #d6e5fb; --dashln: #b9c6da;
  --shadow: rgba(20, 30, 50, .18); --scrim: rgba(15, 22, 35, .45); --toastbg: #1d2636; --toastink: #ffffff;
  --hdr: #172235; --hdr2: #22314b; --hdrln: #34486b; --hdrhov: #24344f; --hdrbot: #0b1220;
  --hdrink: #e9eef6; --hdrink2: #dbe4f2; --hdrmut: #8ea2c2; --hdrtag: #b8c7de; --hdrtagln: #4e6386; --hdrfocus: #5d8fe0;
  --stok: #1f6b3a; --stfail: #a8232a; --stwarn: #8a5300; --onst: #ffffff;
  --brand1: #dfe6f1; --brand2: #9fb3d4; --brand3: #b5413f; --brand4: #172235; --brand5: #3b5b8f;
  --mono: "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;
  --ui: "Segoe UI", "Segoe UI Variable", system-ui, -apple-system, "Liberation Sans", Arial, sans-serif;
  --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --panel: #151b24; --panel2: #1a212c; --line: #2b3443; --line2: #212937;
    --ink: #e4e9f1; --ink2: #b3bccb; --ink3: #8591a3;
    --acc: #4f8ae0; --acc2: #1b2940; --acc3: #9cc0f5; --onacc: #ffffff; --focus: #3f6db5;
    --ok: #4cbf75; --okbg: #13281b; --warn: #e2a33f; --warnbg: #2d2312; --fail: #ef6b6f; --failbg: #2e1618; --info: #9aa5b6; --infobg: #1e2531;
    --errln: #5a2a2d; --wrnln: #5a4420; --ubbg: #262f3d; --ubwarn: #e2a33f;
    --field: #0f141c; --hover: #212a38; --grp: #19212d; --itembg: #121822; --addln: #345283; --addhov: #213454; --dashln: #3a4659;
    --shadow: rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .6); --toastbg: #2b3546; --toastink: #ffffff;
    --hdr: #0a0f17; --hdr2: #151d2b; --hdrln: #2a3954; --hdrhov: #18233a; --hdrbot: #000000;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --panel: #151b24; --panel2: #1a212c; --line: #2b3443; --line2: #212937;
  --ink: #e4e9f1; --ink2: #b3bccb; --ink3: #8591a3;
  --acc: #4f8ae0; --acc2: #1b2940; --acc3: #9cc0f5; --onacc: #ffffff; --focus: #3f6db5;
  --ok: #4cbf75; --okbg: #13281b; --warn: #e2a33f; --warnbg: #2d2312; --fail: #ef6b6f; --failbg: #2e1618; --info: #9aa5b6; --infobg: #1e2531;
  --errln: #5a2a2d; --wrnln: #5a4420; --ubbg: #262f3d; --ubwarn: #e2a33f;
  --field: #0f141c; --hover: #212a38; --grp: #19212d; --itembg: #121822; --addln: #345283; --addhov: #213454; --dashln: #3a4659;
  --shadow: rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .6); --toastbg: #2b3546; --toastink: #ffffff;
  --hdr: #0a0f17; --hdr2: #151d2b; --hdrln: #2a3954; --hdrhov: #18233a; --hdrbot: #000000;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.4 var(--ui); color: var(--ink); background: var(--bg); overflow: hidden; font-variant-numeric: tabular-nums; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--hdr); }
button { font: inherit; }
sub, sup { font-size: 72%; line-height: 0; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

/* ---------- pasek górny */
#top { min-height: 50px; display: flex; align-items: center; gap: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; background: var(--hdr); color: var(--hdrink); border-bottom: 1px solid var(--hdrbot); }
.brand { display: flex; align-items: center; gap: 8px; font-size: 16px; white-space: nowrap; }
.brand b { font-weight: 650; letter-spacing: .2px; }
.brand .tag { font-size: 11px; padding: 1px 6px; border: 1px solid var(--hdrtagln); border-radius: 3px; color: var(--hdrtag); }
#projName { width: 190px; background: var(--hdr2); border: 1px solid var(--hdrln); color: var(--hdrink); padding: 5px 8px; border-radius: 4px; font: inherit; }
#projName:focus { outline: 2px solid var(--hdrfocus); outline-offset: -1px; }
.tb { display: flex; gap: 4px; align-items: center; }
.tb button { background: transparent; color: var(--hdrink2); border: 1px solid transparent; padding: 6px 9px; border-radius: 4px; cursor: pointer; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.tb button:hover { background: var(--hdrhov); border-color: var(--hdrln); }
.tb button svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; flex: none; }
.tb .sep { width: 1px; height: 22px; background: var(--hdrln); margin: 0 4px; }
#status { margin-left: auto; padding: 6px 12px; border-radius: 4px; font-weight: 600; white-space: nowrap; font-size: 13px; color: var(--onst); background: var(--hdr2); }
#status.ok { background: var(--stok); } #status.fail { background: var(--stfail); } #status.warn { background: var(--stwarn); }
#fileName { color: var(--hdrmut); font-size: 12px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- układ */
main { display: flex; height: calc(100% - 50px); }
#inputs { min-width: 0; columns: 3 330px; column-gap: 14px; }
#inputs details.grp { break-inside: avoid; display: block; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.datawrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
#dataside { position: sticky; top: 0; display: flex; flex-direction: column; gap: 12px; }
#dataside .box { padding: 10px 12px; }
#dataside .schemewrap svg { width: 100%; height: auto; }
#dataside .hint { margin: 6px 0 0; }
.schemesvg .supp { cursor: pointer; }
.schemesvg .supp:hover .suphl { fill: var(--acc2); stroke: var(--acc); }
.secedit .zhit { cursor: pointer; }
.secedit .zhit:hover { fill: var(--acc); fill-opacity: .14; stroke: var(--acc); stroke-dasharray: 4 3; }
.rebbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); }
.rebbar .ttl { font-weight: 650; color: var(--acc3); margin-right: 4px; font-size: 12.5px; }
.rebbar select { width: auto; height: 28px; }
.zed { display: flex; flex-direction: column; gap: 8px; }
.zed .zl { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--panel2); }
.zed .zl h5 { margin: 0 0 6px; font-size: 12.5px; color: var(--acc3); display: flex; align-items: center; gap: 8px; }
.zed .zl h5 .sp { flex: 1; }
.zed .zg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 3px 0; font-size: 12.5px; color: var(--ink2); }
.zed .zg select { width: auto; height: 26px; }
.zed .zg .txt { height: 26px; width: 74px; text-align: right; }
.zed .zg .txt.wide { width: 220px; text-align: left; }
.zed .iss { font-size: 12px; color: var(--fail); }
.zed .okm { font-size: 12px; color: var(--ok); }
.dlg.zpop { max-width: 980px !important; }
.zpop .zcols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.zpop .zprev { position: sticky; top: 0; }
.zpop .fields { display: block; }
.suppop .zg { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; font-size: 13px; }
.suppop label.rad { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; flex: 1 1 180px; }
.suppop label.rad.on { border-color: var(--acc); background: var(--acc2); }
.suppop .txt { width: 110px; height: 28px; text-align: right; }
.suppop label.rad svg { flex: none; }
.suppop label.rad small { color: var(--ink3); }
.suptab { margin-top: 6px; }
.suptab tr { cursor: pointer; }
.suptab tr:hover td { background: var(--acc2); }
.suptab td { font-size: 12px; padding: 3px 6px; }
.kv.suptab td:nth-child(2) { text-align: left; font-weight: 400; }
.kv.suptab td:nth-child(3) { white-space: nowrap; }
.zprev table.kv td:nth-child(2) { white-space: nowrap; }
.rebbar label.vib { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink2); margin-left: auto; }
.rebbar label.vib.vibon { cursor: pointer; }
.rebbar label.vib.vibon + label.vib { margin-left: 0; }
.rebbar label.vib.off { opacity: 0.45; }
.rebbar .btn.sm { text-align: left; }
.dlg.fpop { max-width: 620px; }
.dlg.fpop .fields { padding: 0; }
.minisec svg { max-width: 100%; height: auto; }
.zed .hint { margin: 2px 0; }
#out { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* ---------- formularz */
details.grp { border-bottom: 1px solid var(--line); }
details.grp > summary { list-style: none; cursor: pointer; padding-block: 9px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; font-weight: 650; font-size: 12.5px; letter-spacing: .3px; text-transform: uppercase; color: var(--acc3); background: var(--panel2); display: flex; align-items: center; gap: 8px; user-select: none; }
details.grp > summary::-webkit-details-marker { display: none; }
details.grp > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--ink3); border-bottom: 2px solid var(--ink3); transform: rotate(-45deg); transition: transform .12s; margin-right: 2px; }
details.grp[open] > summary::before { transform: rotate(45deg); }
.fields { padding-block: 6px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; }
.row { display: grid; grid-template-columns: 1fr 156px 38px; align-items: center; gap: 6px; min-height: 30px; }
.row label { color: var(--ink2); font-size: 12.5px; }
.row .unit { color: var(--ink3); font-size: 11.5px; }
.row.wide { grid-template-columns: 1fr 218px; }
.hint { font-size: 11.5px; color: var(--ink3); margin: 0 0 6px; padding-left: 2px; }
.hint b { color: var(--ink2); font-weight: 600; }
select, .combo input, .txt, .mtab input { height: 26px; border: 1px solid var(--line); border-radius: 4px; background: var(--field); font: inherit; color: var(--ink); padding: 0 6px; width: 100%; }
select:focus, .combo input:focus, .txt:focus, .mtab input:focus { outline: 2px solid var(--focus); outline-offset: -1px; border-color: var(--acc); }
select { padding-right: 2px; }
.combo { display: flex; position: relative; }
.combo input { border-radius: 4px 0 0 4px; text-align: right; padding-right: 6px; }
.combo button { width: 24px; border: 1px solid var(--line); border-left: 0; background: var(--panel2); border-radius: 0 4px 4px 0; cursor: pointer; color: var(--ink2); padding: 0; }
.combo button:hover { background: var(--acc2); }
.combo input.bad, .txt.bad, .mtab input.bad { border-color: var(--fail); background: var(--failbg); }
.chk { display: flex; align-items: center; gap: 8px; min-height: 28px; color: var(--ink2); font-size: 12.5px; cursor: pointer; }
.chk input { width: 15px; height: 15px; margin: 0; accent-color: var(--acc); flex: none; }
.barrow { display: grid; grid-template-columns: 1fr 60px 14px 74px 38px; align-items: center; gap: 4px; min-height: 30px; }
.barrow .x { text-align: center; color: var(--ink3); }
.barrow label { color: var(--ink2); font-size: 12.5px; }
.mtab { width: 100%; border-collapse: collapse; margin: 4px 0 8px; }
.mtab th { font-weight: 500; color: var(--ink3); font-size: 11.5px; padding: 2px; text-align: center; }
.mtab td { padding: 2px; }
.mtab td:first-child { color: var(--ink2); font-size: 12px; white-space: nowrap; }
.mtab input { height: 25px; text-align: right; padding: 0 5px; }
#pop { position: fixed; z-index: 130; background: var(--panel); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 6px 18px var(--shadow); border-radius: 4px; max-height: 260px; overflow-y: auto; display: none; min-width: 120px; }
#pop div { padding: 4px 10px; cursor: pointer; text-align: right; }
#pop div:hover, #pop div.cur { background: var(--acc2); color: var(--acc3); }

/* ---------- zakładki */
.tabs { display: flex; flex-wrap: wrap; gap: 2px; padding-block: 8px 0; padding-left: 12px; padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--bg); border-bottom: 1px solid var(--line); }
.tabs button { border: 1px solid transparent; border-bottom: 0; background: transparent; padding: 7px 14px; cursor: pointer; color: var(--ink2); border-radius: 5px 5px 0 0; font-weight: 550; }
.tabs button:hover { color: var(--ink); background: var(--hover); }
.tabs button.on { background: var(--panel); border-color: var(--line); color: var(--acc3); margin-bottom: -1px; }
.pane { display: none; flex: 1; overflow: auto; background: var(--panel); padding-block: 16px 30px; padding-left: 18px; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.pane.on { display: block; }
.tscroll { max-width: 100%; overflow-x: auto; }

/* ---------- podsumowanie */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 10px; margin-bottom: 16px; }
.card { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--panel); position: relative; overflow: hidden; min-width: 0; }
.card .t { font-size: 11.5px; color: var(--ink3); text-transform: uppercase; letter-spacing: .3px; font-weight: 600; }
.card .v { font-size: 20px; font-weight: 650; margin-top: 3px; }
.card .s { font-size: 12px; color: var(--ink2); margin-top: 1px; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--line); }
.card.ok::before { background: var(--ok); } .card.fail::before { background: var(--fail); } .card.warn::before { background: var(--warn); }
.msgs { margin: 0 0 14px; }
.msg { padding: 7px 10px; border-radius: 4px; margin-bottom: 6px; font-size: 12.5px; }
.msg.err { background: var(--failbg); color: var(--fail); border: 1px solid var(--errln); }
.msg.wrn { background: var(--warnbg); color: var(--warn); border: 1px solid var(--wrnln); }
table.ctab { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.ctab th { text-align: left; font-weight: 600; color: var(--ink3); font-size: 11.5px; padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--panel2); position: sticky; top: -16px; z-index: 1; }
table.ctab td { padding: 5px 8px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
table.ctab tr.g td { background: var(--grp); font-weight: 650; color: var(--acc3); padding-top: 9px; font-size: 12px; letter-spacing: .2px; }
table.ctab td.ref { color: var(--ink3); white-space: nowrap; font-size: 11.5px; }
table.ctab td.val { white-space: nowrap; text-align: right; font-family: var(--ui); }
table.ctab td.nt { color: var(--ink3); font-size: 11.5px; }
.ub { width: 120px; height: 8px; background: var(--ubbg); border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; }
.ub i { display: block; height: 100%; background: var(--ok); }
.ub.warn i { background: var(--ubwarn); } .ub.fail i { background: var(--fail); }
.pct { display: inline-block; width: 48px; text-align: right; margin-left: 6px; font-weight: 600; font-size: 12px; }
.st { display: inline-block; min-width: 26px; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 700; text-align: center; }
.st.ok { background: var(--okbg); color: var(--ok); } .st.fail { background: var(--failbg); color: var(--fail); } .st.warn { background: var(--warnbg); color: var(--warn); } .st.info { background: var(--infobg); color: var(--info); }

/* ---------- przekroje i wykresy */
.h2 { font-size: 14px; font-weight: 650; margin: 4px 0 10px; color: var(--ink); text-wrap: balance; }
.h2 small { font-weight: 400; color: var(--ink3); margin-left: 6px; }
.flex { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
.flex > * { min-width: 0; }
.box { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--panel); max-width: 100%; overflow-x: auto; }
.box h4 { margin: 0 0 6px; font-size: 12.5px; color: var(--acc3); }
svg text { font-family: var(--ui); }
.kv { border-collapse: collapse; font-size: 12.5px; }
.kv td { padding: 2px 10px 2px 0; }
.kv td:first-child { color: var(--ink2); }
.kv td:nth-child(2) { text-align: right; font-weight: 600; }
.kv td:nth-child(3) { color: var(--ink3); }
table.sched { border-collapse: collapse; font-size: 12.5px; margin-top: 10px; min-width: 640px; }
table.sched th, table.sched td { border: 1px solid var(--line); padding: 4px 8px; }
table.sched th { background: var(--panel2); font-weight: 600; color: var(--ink2); font-size: 12px; }
table.sched td.n { text-align: right; }
table.sched tr.tot td { font-weight: 700; background: var(--panel2); }

/* ---------- raport */
:is(#report, #ownrep) { max-width: 980px; margin: 0 auto; font-size: 12.5px; color: #000; background: #fff; padding: 18px 22px; border-radius: 4px;
  --ok: #1d7f3c; --warn: #a35d00; --fail: #c0262d; --info: #5b6576; --ink: #000; --ink2: #000; --ink3: #000; }
:is(#report, #ownrep) h1 { font-size: 20px; margin: 0 0 4px; text-wrap: balance; }
:is(#report, #ownrep) h2 { font-size: 15px; margin: 22px 0 8px; padding: 4px 0 0; color: #000; page-break-after: avoid; }
:is(#report, #ownrep) h3 { font-size: 13px; margin: 14px 0 6px; color: #000; page-break-after: avoid; }
:is(#report, #ownrep) p { margin: 4px 0 6px; }
:is(#report, #ownrep) .eq { padding: 2px 0 2px 14px; line-height: 1.7; page-break-inside: avoid; overflow-wrap: anywhere; color: #000; }
:is(#report, #ownrep) .eq .r { color: #000; font-size: 11px; margin-left: 8px; }
:is(#report, #ownrep) .eq b { color: #000; }
:is(#report, #ownrep) .eq .ok, :is(#report, #ownrep) .ok { color: var(--ok); font-weight: 700; } :is(#report, #ownrep) .eq .fail, :is(#report, #ownrep) .fail { color: var(--fail); font-weight: 700; } :is(#report, #ownrep) .eq .warn, :is(#report, #ownrep) .warn { color: var(--warn); font-weight: 700; }
:is(#report, #ownrep) .info { color: var(--info); font-weight: 700; }
:is(#report, #ownrep) .note { color: #000; font-size: 11.5px; font-style: italic; }
:is(#report, #ownrep) .fig { display: flex; gap: 16px; flex-wrap: wrap; margin: 8px 0; page-break-inside: avoid; max-width: 100%; overflow-x: auto; }
:is(#report, #ownrep) .verdict { margin-top: 16px; font-weight: 700; font-size: 13px; }
.rtools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; max-width: 980px; margin: 0 auto 8px; }
.rtools .hint { margin: 0 auto 0 0; max-width: 520px; }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; border-radius: 4px; cursor: pointer; color: var(--ink); }
.btn:hover { background: var(--acc2); border-color: var(--addln); }
.btn.pri { background: var(--acc); color: var(--onacc); border-color: var(--acc); }
.btn.pri:hover { background: var(--acc3); border-color: var(--acc3); color: var(--panel); }
.btn.dng { color: var(--fail); }
.btn.dng:hover { background: var(--failbg); border-color: var(--errln); }
.btn:disabled { opacity: .5; cursor: default; }

/* ---------- okna dialogowe */
#modal { position: fixed; inset: 0; background: var(--scrim); display: none; align-items: center; justify-content: center; z-index: 100; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px)); }
#modal .dlg { background: var(--panel); color: var(--ink); border-radius: 8px; padding: 20px 24px; width: 100%; max-width: 640px; max-height: 85vh; overflow: auto; box-shadow: 0 16px 50px var(--shadow); }
#modal .dlg.sm { max-width: 420px; }
#modal h3 { margin: 0 0 8px; text-wrap: balance; }

  '6.2.3': { n: 'PN-EN 1995-1-1', t: 'Zginanie z rozciąganiem osiowym', s: 'Naprężenia od rozciągania i zginania sumuje się liniowo.', f: 'σ<sub>t,0,d</sub>/f<sub>t,0,d</sub> + σ<sub>m,y,d</sub>/f<sub>m,y,d</sub> + k<sub>m</sub>σ<sub>m,z,d</sub>/f<sub>m,z,d</sub> ≤ 1 (6.17) i analogicznie (6.18)', h: '' },
  '6.2.4': { n: 'PN-EN 1995-1-1', t: 'Zginanie ze ściskaniem osiowym (przekrój)', s: 'Wpływ ściskania uwzględnia się kwadratem stopnia wykorzystania – drewno ściskane uplastycznia się, co zmniejsza jego udział.', f: '(σ<sub>c,0,d</sub>/f<sub>c,0,d</sub>)² + σ<sub>m,y,d</sub>/f<sub>m,y,d</sub> + k<sub>m</sub>σ<sub>m,z,d</sub>/f<sub>m,z,d</sub> ≤ 1 (6.19) i (6.20)', h: 'Przy smukłości względnej > 0,3 decydują warunki stateczności 6.3.2.' },
  '6.3.2': { n: 'PN-EN 1995-1-1', t: 'Elementy ściskane i zginane – wyboczenie', s: 'Smukłość względna λ<sub>rel</sub> = λ/π·√(f<sub>c,0,k</sub>/E<sub>0,05</sub>). Gdy λ<sub>rel</sub> ≤ 0,3, wystarcza sprawdzenie przekroju (6.2.4). W innych przypadkach nośność na ściskanie zmniejsza się współczynnikiem wyboczeniowym k<sub>c</sub> (β<sub>c</sub> = 0,2 drewno lite, 0,1 klejone i LVL).', f: 'k = 0,5·[1 + β<sub>c</sub>(λ<sub>rel</sub> − 0,3) + λ<sub>rel</sub>²]; k<sub>c</sub> = 1/(k + √(k² − λ<sub>rel</sub>²)); σ<sub>c,0,d</sub>/(k<sub>c,y</sub>f<sub>c,0,d</sub>) + σ<sub>m,y,d</sub>/f<sub>m,y,d</sub> + k<sub>m</sub>σ<sub>m,z,d</sub>/f<sub>m,z,d</sub> ≤ 1 (6.23), (6.24)', h: 'Długości wyboczeniowe przyjmij z warunków podparcia (l<sub>c</sub> = β·l); stężenia boczne zmniejszają l<sub>c,z</sub>.' },
  '6.3.3': { n: 'PN-EN 1995-1-1', t: 'Zwichrzenie belek', s: 'Smukłość względna przy zginaniu λ<sub>rel,m</sub> = √(f<sub>m,k</sub>/σ<sub>m,crit</sub>); naprężenia krytyczne zależą od sztywności bocznej i skręcania oraz długości efektywnej l<sub>ef</sub> (tab. 6.1: belka swobodnie podparta – 1,0·l przy stałym momencie, 0,9·l przy obciążeniu równomiernym, 0,8·l przy sile w środku; wspornik – 0,5·l i 0,8·l). Obciążenie przyłożone do krawędzi ściskanej zwiększa l<sub>ef</sub> o 2h, do rozciąganej – zmniejsza o 0,5h.', f: 'σ<sub>m,crit</sub> = π·√(E<sub>0,05</sub>I<sub>z</sub>G<sub>0,05</sub>I<sub>tor</sub>)/(l<sub>ef</sub>W<sub>y</sub>) (6.31), dla drewna iglastego ≈ 0,78·b²·E<sub>0,05</sub>/(h·l<sub>ef</sub>) (6.32); k<sub>crit</sub> = 1 (λ ≤ 0,75), 1,56 − 0,75λ (≤ 1,4), 1/λ² (6.34); σ<sub>m,d</sub> ≤ k<sub>crit</sub>f<sub>m,d</sub> (6.33); (σ<sub>m,d</sub>/(k<sub>crit</sub>f<sub>m,d</sub>))² + σ<sub>c,d</sub>/(k<sub>c,z</sub>f<sub>c,0,d</sub>) ≤ 1 (6.35)', h: 'Najskuteczniej: stężyć krawędź ściskaną (belki stropowe, łaty, poszycie, tężniki) albo zwiększyć szerokość b. Program liczy I<sub>tor</sub> wg Saint-Venanta (wzór 6.31) – nieco bezpieczniej niż przybliżenie 6.32.' },
  '6.5.2': { n: 'PN-EN 1995-1-1', t: 'Belki podcięte na podporach', s: 'Podcięcie od strony podpory powoduje koncentrację naprężeń rozciągających w poprzek włókien w narożu. Nośność na ścinanie w przekroju zredukowanym h<sub>ef</sub> zmniejsza się współczynnikiem k<sub>v</sub>, który zależy od stosunku α = h<sub>ef</sub>/h, odległości x od osi reakcji do naroża i nachylenia skosu i (k<sub>n</sub> = 5 drewno lite, 6,5 klejone, 4,5 LVL). Dla podcięcia po stronie przeciwnej do podpory k<sub>v</sub> = 1.', f: 'τ<sub>d</sub> = 1,5·V/(b·h<sub>ef</sub>) ≤ k<sub>v</sub>·f<sub>v,d</sub> (6.60); k<sub>v</sub> = min{1; k<sub>n</sub>(1 + 1,1i<sup>1,5</sup>/√h) / [√h(√(α(1−α)) + 0,8·x/h·√(1/α − α²))]} (6.62)', h: 'Program stosuje b<sub>ef</sub> = k<sub>cr</sub>·b (bezpiecznie). Zmniejsz głębokość podcięcia, odsuń je (mniejsze x), wykonaj skos (i &gt; 0) albo wzmocnij naroże wkrętami.' },
  '6.6': { n: 'PN-EN 1995-1-1', t: 'Wytrzymałość systemu k<sub>sys</sub>', s: 'Gdy kilka podobnych elementów w jednakowym rozstawie jest połączonych ciągłym systemem rozdzielającym obciążenie (np. belki stropowe z poszyciem), wytrzymałość pojedynczego elementu można zwiększyć współczynnikiem k<sub>sys</sub> = 1,1.', h: 'Przekrój złożony z kilku elementów połączonych mechanicznie liczony jest jak przekrój lity – połączenie musi zapewnić współpracę.' },
  '7.2': { n: 'PN-EN 1995-1-1', t: 'Graniczne wartości ugięć belek', s: 'Ugięcie netto poniżej linii łączącej podpory w<sub>net,fin</sub> = w<sub>inst</sub> + w<sub>creep</sub> − w<sub>c</sub> = w<sub>fin</sub> − w<sub>c</sub> (rys. 7.1). Zalecane zakresy (tab. 7.2): belki na dwóch podporach w<sub>inst</sub> l/300–l/500, w<sub>net,fin</sub> l/250–l/350, w<sub>fin</sub> l/150–l/300; wsporniki l/150–l/250, l/125–l/175, l/75–l/150.', h: 'W praktyce krajowej (dawna PN-B-03150) przyjmowano u<sub>net,fin</sub> ≤ l/250 dla belek stropowych i l/200 dla belek dachowych – granice ustal z inwestorem. Przy przekroczeniu zwiększ wysokość (I rośnie z h³) lub zastosuj podniesienie wykonawcze.' },
  '7.3.3': { n: 'PN-EN 1995-1-1', t: 'Drgania stropów mieszkalnych', s: 'Dla stropów o częstotliwości f<sub>1</sub> &gt; 8 Hz sprawdza się ugięcie od siły skupionej 1 kN (w/F ≤ a) i prędkość od impulsu jednostkowego (v ≤ b<sup>(f₁ζ−1)</sup>). Stropy o f<sub>1</sub> ≤ 8 Hz wymagają szczegółowej analizy.', f: 'f<sub>1</sub> = π/(2l²)·√((EI)<sub>l</sub>/m) (7.5); v = 4(0,4 + 0,6n<sub>40</sub>)/(mBl + 200) (7.6); n<sub>40</sub> = {[(40/f<sub>1</sub>)² − 1](B/l)⁴(EI)<sub>l</sub>/(EI)<sub>b</sub>}<sup>0,25</sup> (7.7)', h: 'Wartości a i b przyjmuje się z rys. 7.2 (zalecany zakres), zwykle a = 1,5 mm/kN i b = 100. Współczynnik tłumienia ζ ≈ 0,01.' },
  '6.1.4': { n: 'PN-EN 1995-1-1', t: 'Ściskanie wzdłuż włókien', s: 'Naprężenia ściskające wzdłuż włókien nie mogą przekroczyć wytrzymałości obliczeniowej f<sub>c,0,d</sub>. Przy docisku czoła słupa do blachy podstawy uwzględnia się pole netto (bez nacięcia na blachę wpuszczaną).', f: 'σ<sub>c,0,d</sub> ≤ f<sub>c,0,d</sub> (6.2)', h: 'Przy dużych siłach zastosuj blachę podstawy o większej powierzchni styku albo słup o większym przekroju.' },
  '8.2.3': { n: 'PN-EN 1995-1-1', t: 'Połączenia stal–drewno na łączniki trzpieniowe (wzory Johansena)', s: 'Nośność charakterystyczna łącznika (sworznia, śruby) na jedną płaszczyznę ścinania zależy od wytrzymałości drewna na docisk f<sub>h,k</sub>, grubości drewna t, średnicy d i momentu uplastycznienia łącznika M<sub>y,Rk</sub>; decyduje najmniejsza z wartości dla możliwych postaci zniszczenia. Dla blachy wpuszczanej (stal jako element środkowy) – wzory (8.11), dla blach zewnętrznych – (8.12) blachy cienkie (t ≤ 0,5d) i (8.13) grube (t ≥ d), pośrednie – interpolacja. Efekt liny F<sub>ax,Rk</sub>/4 dla śrub ograniczony do 25% części Johansena; dla sworzni – 0.', f: 'blacha wpuszczana: F<sub>v,Rk</sub> = min{f<sub>h,1,k</sub>t<sub>1</sub>d; f<sub>h,1,k</sub>t<sub>1</sub>d[√(2 + 4M<sub>y,Rk</sub>/(f<sub>h,1,k</sub>dt<sub>1</sub>²)) − 1] + F<sub>ax</sub>/4; 2,3√(M<sub>y,Rk</sub>f<sub>h,1,k</sub>d) + F<sub>ax</sub>/4}; f<sub>h,0,k</sub> = 0,082(1 − 0,01d)ρ<sub>k</sub> (8.32); f<sub>h,α,k</sub> = f<sub>h,0,k</sub>/(k<sub>90</sub>sin²α + cos²α) (8.31); M<sub>y,Rk</sub> = 0,3f<sub>u,k</sub>d<sup>2,6</sup> (8.30)', h: 'γ<sub>M</sub> dla połączeń wg tab. 2.3 = 1,3. Przy szeregu łączników wzdłuż włókien stosuje się efektywną liczbę n<sub>ef</sub> (8.34). Przy niewystarczającej nośności: większa średnica, więcej łączników, grubszy słup (t<sub>1</sub>).' },
  '8.5.1': { n: 'PN-EN 1995-1-1', t: 'Śruby i sworznie obciążone poprzecznie – efektywna liczba łączników', s: 'Przy obciążeniu równoległym do włókien nośność szeregu n łączników jest mniejsza niż n-krotność nośności jednego (rozłupywanie drewna). Przy obciążeniu prostopadłym do włókien n<sub>ef</sub> = n.', f: 'n<sub>ef</sub> = min{n; n<sup>0,9</sup>·(a<sub>1</sub>/(13d))<sup>0,25</sup>} (8.34)', h: 'Większy rozstaw a<sub>1</sub> zwiększa n<sub>ef</sub>.' },
  '8.6': { n: 'PN-EN 1995-1-1', t: 'Minimalne rozstawy i odległości łączników trzpieniowych (tab. 8.5 – śruby, tab. 8.6 – sworznie)', s: 'Rozstaw wzdłuż włókien a<sub>1</sub>, w poprzek włókien a<sub>2</sub>, odległość od końca obciążonego a<sub>3,t</sub> i od krawędzi a<sub>4</sub> zależą od średnicy d i kąta α siły do włókien. Dla sworzni: a<sub>1</sub> = (3 + 2|cos α|)d, a<sub>2</sub> = 3d, a<sub>3,t</sub> = max(7d; 80 mm), a<sub>4,t</sub> = max((2 + 2sin α)d; 3d), a<sub>4,c</sub> = 3d; dla śrub: a<sub>1</sub> = (4 + |cos α|)d, a<sub>2</sub> = 4d.', h: 'Przy odrywaniu słupa od fundamentu czoło słupa jest końcem obciążonym (a<sub>3,t</sub>).' },
  'A.1': { n: 'PN-EN 1995-1-1, zał. A', t: 'Ścinanie blokowe i wyrwanie bloku drewna', s: 'W połączeniach stal–drewno z wieloma łącznikami obciążonymi wzdłuż włókien może nastąpić wyrwanie bloku drewna objętego łącznikami: rozciąganie na powierzchni czołowej A<sub>net,t</sub> albo ścinanie wzdłuż boków A<sub>net,v</sub>.', f: 'F<sub>bs,Rk</sub> = max{1,5A<sub>net,t</sub>f<sub>t,0,k</sub>; 0,7A<sub>net,v</sub>f<sub>v,k</sub>} (A.1)', h: 'Zwiększ odległość a<sub>3,t</sub> i rozstaw łączników albo grubość drewna.' },
  'EN 1993-1-8': { n: 'PN-EN 1993-1-8', t: 'Blachy stalowe: docisk łączników i docisk do betonu', s: 'Nośność blachy na docisk łącznika (tab. 3.4): F<sub>b,Rd</sub> = k<sub>1</sub>α<sub>b</sub>f<sub>u</sub>dt/γ<sub>M2</sub>, α<sub>b</sub> = min{e<sub>1</sub>/(3d<sub>0</sub>); f<sub>ub</sub>/f<sub>u</sub>; 1}, γ<sub>M2</sub> = 1,25. Wytrzymałość połączenia z betonem pod blachą podstawy (6.2.5): f<sub>jd</sub> = β<sub>j</sub>·k<sub>j</sub>·f<sub>cd</sub>, β<sub>j</sub> = 2/3.', h: 'Program przyjmuje k<sub>1</sub> = 2,5 (wymagane odległości od krawędzi blachy) i k<sub>j</sub> = 1 (bezpiecznie, bez rozkładu w fundamencie). Grubość blachy podstawy i spoiny należy dobrać osobno.' },
  'EN 1992-4': { n: 'PN-EN 1992-4', t: 'Kotwy w betonie – interakcja rozciągania i ścinania', s: 'Nośności obliczeniowe kotwy na rozciąganie N<sub>Rd</sub> i ścinanie V<sub>Rd</sub> (najmniejsze z postaci zniszczenia: stal, wyrwanie, stożek betonu, odłupanie krawędzi) podaje Europejska Ocena Techniczna (ETA) kotwy dla przyjętego betonu, głębokości osadzenia i odległości od krawędzi. Przy jednoczesnym działaniu obu sił sprawdza się interakcję.', f: '(N<sub>Ed</sub>/N<sub>Rd</sub>)<sup>1,5</sup> + (V<sub>Ed</sub>/V<sub>Rd</sub>)<sup>1,5</sup> ≤ 1 (7.54, zniszczenie stali i betonu – wariant uproszczony)', h: 'Wpisz N<sub>Rd</sub>, V<sub>Rd</sub> z ETA wybranej kotwy; program nie wyznacza nośności kotew.' },
  '1990': { n: 'PN-EN 1990', t: 'Kombinacje oddziaływań', s: 'W SGN dla sytuacji trwałych i przejściowych stosuje się kombinację (6.10) albo mniej korzystną z (6.10a) i (6.10b). W sytuacji wyjątkowej – (6.11b). W SGU – charakterystyczną (6.14b) i quasi-stałą (6.16b).', f: '(6.10a): Σγ<sub>G</sub>G<sub>k</sub> + Σγ<sub>Q</sub>ψ<sub>0,i</sub>Q<sub>k,i</sub>; (6.10b): Σξγ<sub>G</sub>G<sub>k</sub> + γ<sub>Q,1</sub>Q<sub>k,1</sub> + Σγ<sub>Q</sub>ψ<sub>0,i</sub>Q<sub>k,i</sub>; (6.11b): ΣG<sub>k</sub> + A<sub>d</sub> + ψ<sub>1,1</sub>(ψ<sub>2,1</sub>)Q<sub>k,1</sub> + Σψ<sub>2,i</sub>Q<sub>k,i</sub>', h: 'Wartości ZK PL: γ<sub>G,sup</sub> = 1,35, γ<sub>G,inf</sub> = 1,0, γ<sub>Q</sub> = 1,5, ξ = 0,85; ψ wg tab. A1.1.' },
  '1991': { n: 'PN-EN 1991-1-1', t: 'Obciążenia użytkowe stropów i dachów', s: 'Kategorie użytkowania (tab. 6.1) i wartości q<sub>k</sub>, Q<sub>k</sub> (tab. 6.2, 6.4, 6.8, 6.10): A – mieszkalne (stropy 1,5–2,0 kN/m²), B – biurowe (2,0–3,0), C – zebrań (2,0–7,5), D – handlowe (4,0–5,0), E – magazyny (≥ 7,5), H – dachy niedostępne (0,0–1,0).', h: 'Program przyjmuje górną granicę zakresu × pasmo zbierania obciążenia (rozstaw belek); wartość można wpisać ręcznie.' },
  'fi:2.3': { n: 'PN-EN 1995-1-2', t: 'Wartości obliczeniowe w pożarze', s: 'Wytrzymałość obliczeniowa w pożarze: f<sub>d,fi</sub> = k<sub>mod,fi</sub>·f<sub>20</sub>/γ<sub>M,fi</sub>, gdzie f<sub>20</sub> = k<sub>fi</sub>·f<sub>k</sub> (20% kwantyl), k<sub>fi</sub> = 1,25 drewno lite, 1,15 klejone, 1,1 LVL; w metodzie zredukowanego przekroju k<sub>mod,fi</sub> = 1,0, γ<sub>M,fi</sub> = 1,0.', h: '' },
  'fi:3.4': { n: 'PN-EN 1995-1-2', t: 'Zwęglanie', s: 'Głębokość zwęglenia rośnie liniowo w czasie: d<sub>char,n</sub> = β<sub>n</sub>·t (β<sub>n</sub> = 0,8 mm/min drewno lite iglaste, 0,7 klejone i LVL, 0,55–0,7 liściaste). Okładzina (np. płyta g-k) opóźnia początek zwęglania do t<sub>ch</sub> i spowalnia je (k<sub>2</sub>) do chwili jej zniszczenia t<sub>f</sub>, po czym zwęglanie przyspiesza (k<sub>3</sub> = 2) do głębokości 25 mm.', f: 'płyta g-k typu A, F, H: t<sub>ch</sub> = 2,8h<sub>p</sub> − 14 (3.11); k<sub>2</sub> = 1 − 0,018h<sub>p</sub> (3.10)', h: 'Czas zniszczenia okładziny t<sub>f</sub> dla płyt typu F należy przyjąć z badań producenta.' },
  'fi:4.2.2': { n: 'PN-EN 1995-1-2', t: 'Metoda zredukowanego przekroju', s: 'Przekrój efektywny otrzymuje się odejmując od przekroju początkowego efektywną głębokość zwęglenia d<sub>ef</sub> po ogrzewanych stronach; przyjmuje się, że materiał w pozostałym przekroju ma pełną wytrzymałość i sztywność (wartości 20% kwantyla).', f: 'd<sub>ef</sub> = d<sub>char,n</sub> + k<sub>0</sub>·d<sub>0</sub>, d<sub>0</sub> = 7 mm; k<sub>0</sub> = t/20 dla t &lt; 20 min, 1,0 dla t ≥ 20 min (tab. 4.1)', h: 'Kombinacja wg PN-EN 1990 (6.11b) z ψ<sub>2,1</sub> (zalecane w PN-EN 1991-1-2, 4.3.1) lub ψ<sub>1,1</sub>. Docisku w poprzek włókien w pożarze zwykle nie sprawdza się.' },
};
const ALIAS = { '6.11': '6.1.6', '6.12': '6.1.6', '6.13': '6.1.7', '6.14': '6.1.8', '6.17': '6.2.3', '6.18': '6.2.3', '6.19': '6.2.4', '6.20': '6.2.4', '6.23': '6.3.2', '6.24': '6.3.2', '6.31': '6.3.3', '6.32': '6.3.3', '6.33': '6.3.3', '6.34': '6.3.3', '6.35': '6.3.3', '6.60': '6.5.2', '6.62': '6.5.2', '6.10': '1990', '6.10a': '1990', '6.10b': '1990', '6.11b': '1990', '6.14b': '1990', '6.16b': '1990', '3.1': '3.1.3', '3.2.4': '3.1.4', '2.14': '2.4.1', '7.5': '7.3.3', '7.6': '7.3.3', '7.7': '7.3.3', '6.1': '6.3.3', '7.1': '7.2', '2.3': '2.4.1', '2.2': '2.3.1.2', '3.2': '3.1.4', '8.11': '8.2.3', '8.12': '8.2.3', '8.13': '8.2.3', '8.30': '8.2.3', '8.31': '8.2.3', '8.32': '8.2.3', '8.33': '8.2.3', '8.34': '8.5.1', '8.5': '8.6', '6.2': '6.1.4' };
function key(ref, grp) {
  if (!ref) return null;
  let r = String(ref).replace(/\(.*$/, '').trim();
  if (/^Pożar|1995-1-2/.test(grp || '')) { if (N['fi:' + r]) return 'fi:' + r; if (r === '4.2.2' || r === '3.4' || r === '2.3') return 'fi:' + r; }
  if (N[r]) return r;
  if (ALIAS[r]) return ALIAS[r];
  if (/^8\.5\.1/.test(r)) return '8.5.1';
  if (/^8\.(2|3)/.test(r)) return '8.2.3';
  const p = r.split('.'); while (p.length > 1) { p.pop(); if (N[p.join('.')]) return p.join('.'); }
  return null;
}
function html(ref, grp) {
  const k = key(ref, grp); if (!k) return '';
  const o = N[k], lab = k === '1990' || k === '1991' ? o.n : `${o.n}, ${k.startsWith('fi:') ? k.slice(3) : k}`;
  return `<div class="nexp"><h3>${lab} – ${o.t}</h3><p>${o.s}</p>${o.f ? `<p class="eq">${o.f}</p>` : ''}${o.h ? `<p><b>Wskazówka:</b> ${o.h}</p>` : ''}<p style="font-size:11.5px;color:var(--ink3)">Streszczenie własne – nie zastępuje tekstu normy.</p></div>`;
}
// odnośniki w tekście: „6.1.7(3)”, „tab. 6.1”, „(6.32)” → przyciski objaśnień
const RX = /(PN-EN\s*1995-1-2[,\s]*)?(tab\.\s*|wzór\s*|\()?\b(\d\.\d{1,2}(?:\.\d{1,2})?[ab]?)(\(\d+\))?(\))?/g;
const SKIP = 'svg,button,select,option,textarea,input,script,style,.nlink,#top,.tabs,[contenteditable],.lchart,.nexp';
function linkRefs(root) {
  if (!root || !root.querySelectorAll) return;
  const scope = root.matches && root.matches('#report, .hint, .rexp, .ctab, .combsum, .msd, .lpsi, #modal, .reqt') ? [root] : Array.from(root.querySelectorAll('#report, .hint, .rexp, .combsum, .msd, .lpsi, .reqt, #modal .dlg'));
  scope.forEach(el => {
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, { acceptNode: n => (n.parentElement && n.parentElement.closest(SKIP)) ? NodeFilter.FILTER_REJECT : (/\d\.\d/.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT) });
    const list = []; while (walker.nextNode()) list.push(walker.currentNode);
    list.forEach(tn => {
      const t = tn.nodeValue; let m, last = 0, out = null; RX.lastIndex = 0;
      while ((m = RX.exec(t))) {
        const tok = m[3], fi = !!m[1];
        // liczby dziesiętne z przecinkiem nie są odnośnikami; pomijamy wartości liczbowe jak „0.5”
        const prev = t[m.index - 1] || '';
        if (/[\d,]/.test(prev)) continue;
        if (/199[1-4]-\d(-\d)?[,\s]*(tab\.\s*)?$/.test(t.slice(Math.max(0, m.index - 20), m.index + (m[1] ? m[1].length : 0)))) continue;
        if (!m[2] && !m[4] && tok.split('.').length < 3 && !/^[67]\.\d$/.test(tok)) continue;
        const k = key(tok, fi ? 'Pożar' : '');
        if (!k) continue;
        out = out || document.createDocumentFragment();
        const st = m.index + (m[1] ? m[1].length : 0) + (m[2] ? m[2].length : 0);
        out.appendChild(document.createTextNode(t.slice(last, st)));
        const b = document.createElement('button'); b.className = 'nlink'; b.dataset.nref = tok; if (fi) b.dataset.grp = 'Pożar'; b.textContent = tok + (m[4] || '');
        out.appendChild(b); last = st + tok.length + (m[4] ? m[4].length : 0);
      }
      if (out) { out.appendChild(document.createTextNode(t.slice(last))); tn.parentNode.replaceChild(out, tn); }
    });
  });
}
let busy = false;
function observe(body) {
  const run = () => { busy = true; try { linkRefs(document.getElementById('out')); linkRefs(document.getElementById('modal')); linkRefs(document.getElementById('nmodal')); } finally { obs.takeRecords(); busy = false; } };
  let t = null;
  const obs = new MutationObserver(() => { if (busy) return; clearTimeout(t); t = setTimeout(run, 30); });
  obs.observe(body, { childList: true, subtree: true });
}
window.BDN = { N, key, html, linkRefs, observe };
})();

// rysunek podstawy słupa: widok z boku (płaszczyzna blachy) z łącznikami, blachą podstawy, kotwami i fundamentem
function colSVG(c, o) {
  o = o || {};

  const sc = Math.min(230 / Math.max(c.pa, c.h + 80), 260 / (zone + 160));
  const W = 330, H = Math.round((zone + 190) * sc) + 40, cx = 150, yF = H - 40 - 70 * sc;   // yF – wierzch fundamentu
  const tp = 15, yP = yF - tp * sc, yC = yP - c.gap * sc;      // blacha podstawy, czoło słupa
  const X = v => cx + v * sc, hh = c.h / 2;
  let s = svgOpen(W, H, 'class="colsvg"');
  s += `<rect x="${X(-c.pa / 2 - 60)}" y="${yF}" width="${(c.pa + 120) * sc}" height="${70 * sc + 30}" fill="#cfd4db" stroke="#5d6778"/>` + tx(X(c.pa / 2 + 50), yF + 16, esc(c.conc), { a: 'end', fs: 9.5, c: '#4a5466' });
  s += `<rect x="${X(-c.pa / 2)}" y="${yP}" width="${c.pa * sc}" height="${tp * sc}" fill="#9aa3b0" stroke="#39414f"/>`;
  const na = c.na, ax = na === 1 ? [0] : Array.from({ length: na }, (_, i) => -c.pa / 2 + 35 + (c.pa - 70) * i / (na - 1));
  ax.forEach(x => { s += `<line x1="${X(x)}" y1="${yP - 8}" x2="${X(x)}" y2="${yF + 60 * sc + 22}" stroke="#39414f" stroke-width="2"/><rect x="${X(x) - 5}" y="${yP - 7}" width="10" height="5" fill="#39414f"/>`; });
  s += `<rect x="${X(-hh)}" y="${yC - zone * sc}" width="${c.h * sc}" height="${zone * sc}" fill="${WOOD}" stroke="${WOODE}" stroke-width="1.3"/>`;
  s += `<path d="M${X(-hh)},${yC - zone * sc} l6,-6 l6,6 l6,-6 l6,6" fill="none" stroke="${WOODE}"/>`;
  const plH = c.a3 + (c.n - 1) * c.a1 + c.e1p + c.gap, plW = c.h - 20;
  if (c.type === 'slot') s += `<rect x="${X(-plW / 2)}" y="${yP - plH * sc}" width="${plW * sc}" height="${plH * sc}" fill="#9aa3b0" fill-opacity="0.35" stroke="#39414f" stroke-dasharray="4 2"/>`;
  else s += `<rect x="${X(-plW / 2)}" y="${yP - plH * sc}" width="${plW * sc}" height="${plH * sc}" fill="#9aa3b0" fill-opacity="0.55" stroke="#39414f"/>`;
  const xs = c.m === 1 ? [0] : Array.from({ length: c.m }, (_, j) => -(c.m - 1) * c.a2 / 2 + j * c.a2);
  for (let i = 0; i < c.n; i++) xs.forEach(x => { const y = yC - (c.a3 + i * c.a1) * sc; s += `<circle cx="${X(x)}" cy="${y}" r="${Math.max(2.5, c.d / 2 * sc)}" fill="#ffffff" stroke="#1b2230" stroke-width="1.2"/>`; });
  // wymiary
  s += dimV(X(hh) + 16, yC - c.a3 * sc, yC, `a₃=${fmt(c.a3, 0)}`, { right: true, fs: 9.5 });
  if (c.n > 1) s += dimV(X(hh) + 16, yC - (c.a3 + c.a1) * sc, yC - c.a3 * sc, `a₁=${fmt(c.a1, 0)}`, { right: true, fs: 9.5 });
  s += dimH(X(-hh), X(hh), yC - zone * sc - 14, `h = ${fmt(c.h, 0)}`, { fs: 9.5 });
  if (c.gap > 0) s += tx(X(-hh) - 4, yC + 2, `szczelina ${fmt(c.gap, 0)}`, { a: 'end', fs: 9, c: '#5b6576' });
  s += tx(X(-c.pa / 2), yF + 12, `blacha ${fmt(c.pa, 0)}×${fmt(c.pb, 0)}`, { a: 'start', fs: 9, c: '#4a5466' });
  // przekrój poziomy słupa przez łączniki

  };
  changed(false);
  setTimeout(draw, 120);

function sectionSVG(sec, o) {
  o = o || {};
  const b = sec.b, h = sec.h, n = sec.n || 1, maxD = o.size || 200;
  const sc = Math.min(maxD / h, (maxD * 0.9) / b, 1.2);
  const W = b * sc + 110, H = h * sc + 70, x0 = 55, y0 = 22;
  let s = svgOpen(W, H, `class="secsvg"`);
  const bw = b / n;
  for (let k = 0; k < n; k++) {
    const xa = x0 + k * bw * sc;
    s += `<rect x="${xa}" y="${y0}" width="${bw * sc}" height="${h * sc}" fill="${WOOD}" stroke="${WOODE}" stroke-width="1.3"/>`;
    // słoje (łuki z rdzeniem poza przekrojem – przekrój tarcicy)
    const cx = xa + bw * sc / 2, cy = y0 + h * sc + Math.max(bw, h) * sc * 0.6;
    s += `<clipPath id="cl${o.id || ''}${k}"><rect x="${xa}" y="${y0}" width="${bw * sc}" height="${h * sc}"/></clipPath><g clip-path="url(#cl${o.id || ''}${k})" fill="none" stroke="${WOODG}" stroke-width="0.7" opacity="0.8">`;
    for (let r = 12; r < (h + bw) * sc * 1.6; r += 9) s += `<circle cx="${cx}" cy="${cy}" r="${r}"/>`;
    s += '</g>';
    if (o.glulam) for (let yy = 40; yy < h; yy += 40) s += `<line x1="${xa}" y1="${y0 + yy * sc}" x2="${xa + bw * sc}" y2="${y0 + yy * sc}" stroke="${WOODE}" stroke-width="0.6"/>`;
  }
  if (o.fire) {
    const f = o.fire, bfi = Math.max(0, f.bfi), hfi = Math.max(0, f.hfi), top = o.fireTop;
    const fx = x0 + (b - bfi) / 2 * sc, fy = y0 + (top ? (h - hfi) / 2 : 0) * sc;
    s += `<path d="M${x0},${y0} h${b * sc} v${h * sc} h${-b * sc} z M${fx},${fy} v${hfi * sc} h${bfi * sc} v${-hfi * sc} z" fill="#39414f" fill-opacity="0.55" fill-rule="evenodd"/>`;
    s += `<rect x="${fx}" y="${fy}" width="${bfi * sc}" height="${hfi * sc}" fill="none" stroke="#c0262d" stroke-width="1.4" stroke-dasharray="5 3"/>`;
    s += tx(x0 + b * sc / 2, y0 + h * sc + 32, `po R${S.fire.R}: ${fmt(bfi, 0)}×${fmt(hfi, 0)} mm`, { fs: 10, c: '#c0262d' });
  }
  // osie
  s += `<line x1="${x0 - 12}" y1="${y0 + h * sc / 2}" x2="${x0 + b * sc + 12}" y2="${y0 + h * sc / 2}" stroke="#1d5bb8" stroke-width="0.7" stroke-dasharray="8 3 2 3"/>` + tx(x0 + b * sc + 16, y0 + h * sc / 2 + 4, 'y', { a: 'start', fs: 10, c: '#1d5bb8' });
  s += `<line x1="${x0 + b * sc / 2}" y1="${y0 - 10}" x2="${x0 + b * sc / 2}" y2="${y0 + h * sc + 10}" stroke="#1d5bb8" stroke-width="0.7" stroke-dasharray="8 3 2 3"/>` + tx(x0 + b * sc / 2 + 4, y0 - 4, 'z', { a: 'start', fs: 10, c: '#1d5bb8' });
  s += dimH(x0, x0 + b * sc, y0 + h * sc + 16, `b = ${fmt(b, 0)}`, { below: true, fs: 10 });
  s += dimV(x0 - 18, y0, y0 + h * sc, `h = ${fmt(h, 0)}`, { fs: 10 });
  return s + '</svg>';
}
// rozkład naprężeń normalnych (σ_m) i stycznych (τ) – mały wykres przy przekroju
function stressSVG(sec, sig, tau, o) {

  if (tau) { let p = `${xt},${y0} `; for (let k = 0; k <= 20; k++) { const z = k / 20; p += `${(xt + 32 * 4 * z * (1 - z)).toFixed(1)},${(y0 + z * h * sc).toFixed(1)} `; } p += `${xt},${y0 + h * sc}`; s += `<polygon points="${p}" fill="#c9d4e6" fill-opacity="0.7" stroke="#1d5bb8"/>` + tx(xt + 34, y0 + h * sc / 2 + 4, fmt(tau, 2), { a: 'start', fs: 9.5, c: '#1d5bb8' }) + tx(xt, H - 4, 'τ [MPa]', { fs: 9.5, c: '#4a5466' }); }
  return s + '</svg>';
}

    for (let i = 0; i < c.n; i++) xs.forEach(dx => circle(xx + dx, yB + c.a3 + i * c.a1, c.d / 2, 'STOPY'));
    const na = c.na, ax = na === 1 ? [0] : Array.from({ length: na }, (_, i) => -c.pa / 2 + 35 + (c.pa - 70) * i / (na - 1));
    ax.forEach(dx => line(xx + dx, yP + 15, xx + dx, yP - 250, 'STOPY'));
    rect(xx - c.pa / 2 - 150, yP - 400, c.pa + 300, 400, 'FUNDAMENT');
    text(xx + c.h / 2 + 40, yB + Lc / 2, 50, `SLUP ${Math.round(c.b)}x${Math.round(c.h)}, H=${Math.round(Lc)}`, 'OPISY');

    yLow = Math.min(yLow, yP - 400);
  });
  // wymiary
  let y = Math.min(-500, yLow - 300);
  md.segs.forEach(sg => dimH(X(sg.x0), X(sg.x1), y, String(Math.round(sg.L * 1000))));
  y -= 300; dimH(0, md.Lmember * 1000, y, `${Math.round(md.Lmember * 1000)}`);
  line(-250, 0, -250, md.segs[0].h, 'WYMIARY'); text(-300, md.segs[0].h / 2, 60, String(Math.round(md.segs[0].h)), 'WYMIARY');
  // przekrój
  const sec = md.segs[0].sec, sx = md.Lmember * 1000 + 800;
  const bw = sec.b / sec.n;
  for (let k = 0; k < sec.n; k++) rect(sx + k * bw, 0, bw, sec.h, 'PRZEKROJ');
  line(sx - 100, sec.h / 2, sx + sec.b + 100, sec.h / 2, 'OSIE'); line(sx + sec.b / 2, -100, sx + sec.b / 2, sec.h + 100, 'OSIE');
  text(sx, sec.h + 150, 60, `PRZEKROJ ${sec.n > 1 ? sec.n + 'x' : ''}${Math.round(sec.b1)}x${Math.round(sec.h)}`, 'OPISY');
  if (R.fireData && R.fireData.segs[0] && R.fireData.segs[0].bfi > 0) { const q = R.fireData.segs[0]; rect(sx + (sec.b - q.bfi) / 2, S.fire.sides === 4 ? (sec.h - q.hfi) / 2 : 0, q.bfi, q.hfi, 'PRZEKROJ_POZAR'); text(sx, -200, 50, `R${S.fire.R}: ${Math.round(q.bfi)}x${Math.round(q.hfi)}`, 'OPISY'); }
  // opis
  const mt = R.mt;
  text(0, hmax + 450, 100, `${S.meta.name || 'Belka'} - ${mt.m.name} ${sec.n > 1 ? sec.n + 'x' : ''}${Math.round(sec.b1)}x${Math.round(sec.h)} mm, L = ${Math.round(md.Lmember * 1000)} mm`, 'OPISY');
  text(0, hmax + 320, 60, `Klasa uzytkowania ${S.env.sc}; eta max = ${Math.round(R.maxEta * 100)}%; BelkaDR`, 'OPISY');
  const layers = [['BELKA', 7, 'CONTINUOUS'], ['PODPORY', 8, 'CONTINUOUS'], ['OSIE', 1, 'DASHDOT'], ['PODCIECIA', 1, 'CONTINUOUS'], ['STEZENIA', 3, 'CONTINUOUS'], ['WYMIARY', 4, 'CONTINUOUS'], ['PRZEKROJ', 7, 'CONTINUOUS'], ['PRZEKROJ_POZAR', 1, 'DASHED'], ['OPISY', 2, 'CONTINUOUS'], ['SLUPY', 30, 'CONTINUOUS'], ['STOPY', 8, 'CONTINUOUS'], ['FUNDAMENT', 9, 'CONTINUOUS']];
  const H = ['0', 'SECTION', '2', 'HEADER', '9', '$ACADVER', '1', 'AC1009', '9', '$INSBASE', '10', '0.0', '20', '0.0', '30', '0.0', '9', '$EXTMIN', '10', '-1000.0', '20', n(Math.min(-1500, y - 400)), '30', '0.0', '9', '$EXTMAX', '10', n(md.Lmember * 1000 + 2000), '20', n(hmax + 1000), '30', '0.0', '0', 'ENDSEC',
    '0', 'SECTION', '2', 'TABLES',
    '0', 'TABLE', '2', 'LTYPE', '70', '3',
    '0', 'LTYPE', '2', 'CONTINUOUS', '70', '0', '3', 'Solid line', '72', '65', '73', '0', '40', '0.0',
    '0', 'LTYPE', '2', 'DASHED', '70', '0', '3', '__ __ __', '72', '65', '73', '2', '40', '30.0', '49', '20.0', '49', '-10.0',
    '0', 'LTYPE', '2', 'DASHDOT', '70', '0', '3', '__ . __ .', '72', '65', '73', '4', '40', '50.0', '49', '30.0', '49', '-8.0', '49', '0.0', '49', '-12.0',
    '0', 'ENDTAB',
    '0', 'TABLE', '2', 'LAYER', '70', String(layers.length)];
  layers.forEach(([nm, col, lt]) => H.push('0', 'LAYER', '2', nm, '70', '0', '62', String(col), '6', lt));
  H.push('0', 'ENDTAB', '0', 'ENDSEC', '0', 'SECTION', '2', 'ENTITIES');
  return H.concat(L, ['0', 'ENDSEC', '0', 'EOF']).join('\r\n') + '\r\n';
};
